name: Memory limit build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Preserve memfix-3 bundle version
        run: python3 scripts/ci/workflow.py set-marketing-version "0.7.0-memfix+b06ddd9"

      - name: Test authentication and Memory+ without signing in
        working-directory: Dependencies/SideSign
        run: swift test --filter 'AnisetteAuthTests|CapabilityTests'

      - name: Build
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-memfix.ipa
          path: SideStore.ipa
